<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do-list Web</title>
    <link rel="stylesheet" href="/style/style.css">
</head>

<body>
    <main>
        <div class="container">
            <h1>To Do List</h1>
            <div>
                <input type="text" id="task" required placeholder="Enter task here...">

                <button type="button" onclick="getTask()">Add</button>
                <button type="button" onclick="deleteAll()">Delete All</button>
            </div>

            <div id="taskList">
                <!-- Tasks will be added here using JavaScript -->
            </div>
        </div>
    </main>

    <script src="/script/script.js"></script>
</body>

</html>
